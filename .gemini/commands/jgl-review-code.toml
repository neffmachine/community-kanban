description = "Review the codebase for structural issues — duplication, large files, dead code, dependency health — using LLM analysis, static analysis, and coverage data. Produces a refactor plan if warranted. Use when the user says \"review code\", \"/jgl-review-code\", \"code review\", \"anything need refactoring?\", or \"look over the code\"."

prompt = """

# Review Code

Review the codebase for structural quality. Use three sources of information:

1. **Your own analysis** — read the code and identify issues.
2. **Static analysis** — run the project's actual type-checker and linter. For a TypeScript project that's `npx tsc -b` plus `npm run lint` if a `lint` script exists. For Python use `mypy` or `pyright` if the project is configured for it. **If neither exists, say so explicitly** — it's a finding, not a clean line.
3. **Coverage data** — run the project's coverage command. For Vitest: `npm run test:coverage`. For Jest: `npm test -- --coverage`. For Python: `pytest --cov`. Low coverage on logic-heavy files is a structural smell — it often means the logic is tangled into framework code and can't be tested in isolation.

**Before running any of the above, check that the tool exists.** If the
project has no coverage script, no linter, or no dependency-audit tool,
**don't silently skip** — report each one as `⊘ SKIPPED — <tool> not
configured` with a one-line install or setup hint. A silent skip looks
identical to a clean run; an honest skip tells the user where the audit
has gaps. This is especially load-bearing in brownfield repos, where
absent tooling is itself a finding.

## What to check

1. **Files well over ~500 lines that do more than one thing** — length alone isn't the smell; multiple responsibilities is. List them with line counts. Also flag the reverse: **excessive fragmentation** — clusters of tiny files that plausibly belong to one concept (a single domain split across many one-function files adds navigation cost for humans and AI agents alike).
2. **Duplicated logic** — same block of code in three or more places. Point out where.
3. **Dead code** — unused exports, commented-out blocks, unreachable branches. Point out where.
4. **Tangled logic** — pure business logic embedded in React components, API handlers, or other framework glue that should be extracted into testable modules.
5. **Type safety gaps** — `any` types, unsafe casts, missing return types on public functions.
6. **Security concerns** — hardcoded secrets, missing input validation at system boundaries, obvious vulnerabilities. Flag immediately.
7. **Dependency health** — run the project's audit tool: `npm audit`, `pnpm audit`, `pip-audit`, `cargo audit`, etc. If the tool isn't installed, report `⊘ SKIPPED — <tool> not installed (install: <command>)`. Don't claim a clean audit when no audit ran.

## What NOT to do

- Don't fix anything. Just report and plan.
- Don't nitpick formatting or style.
- Don't suggest speculative future improvements.
- Don't propose refactors for code that has no test coverage — flag it as needing tests first (that's a `/jgl-review-testing` concern).

## Refactor threshold

Not every finding warrants a refactor. Use this threshold to decide:

- **No refactor needed** if: no oversized multi-responsibility files (well past ~500 lines), no fragmented one-concept-many-files clusters, no logic duplication beyond 2x, no tangled business logic, `npm audit` is clean, and type coverage is solid. Say so and stop.
- **Refactor recommended** if any of these are true:
  - 3+ oversized files (well past ~500 lines) that each carry more than one responsibility
  - A single concept fragmented across many tiny files (e.g. one-function-per-file) that would read better consolidated
  - Same logic block duplicated 3+ times
  - Business logic embedded in framework code that can't be unit tested
  - `npm audit` reports moderate or higher vulnerabilities
  - Multiple `any` types in core logic files

## Refactor plan

If the threshold is met, end with a prioritized refactor plan:

1. **Do first** — high-value, low-risk items (extracting duplicated logic, splitting oversized files, fixing audit vulnerabilities).
2. **Do second** — medium-value items (extracting tangled logic into pure modules, replacing `any` with real types).
3. **Skip for now** — items that are real but not worth the effort yet, with a one-line explanation of why.

For each item, list the file path, what's wrong, and what the fix would be. Keep it concrete — "extract lines 45-120 of `api/orders.ts` into `lib/orderCalculations.ts`" not "consider refactoring the orders module."

**Important**: if any files in the refactor plan lack test coverage, note that tests should be added *before* refactoring (use `/jgl-review-testing` first).
"""
