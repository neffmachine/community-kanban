description = "Run the full verification suite — tests, build, and dependency audit. Use when the user says \"check\", \"/jgl-check\", \"verify\", \"is everything passing\", or after any significant change."

prompt = """

# Check

Run the full verification suite and report results honestly: what passed,
what failed, and what was **skipped because the tool wasn't installed**.

A silent skip is worse than a failure. If `pip-audit` isn't installed and
you just move on, the user thinks the security audit passed. Don't do
that — report every skip with a one-line "install with X" hint and treat
it as a finding.

## 1. Detect the stack

Before running anything, figure out what the project actually uses. Look
at the files in the repo root:

- `package.json` — Node/JS/TS. Check `scripts` to see what's available
  (`test`, `test:ci`, `test:reliable`, `lint`, `build`, `typecheck`).
- `pyproject.toml` / `requirements.txt` / `requirements-dev.txt` — Python.
- `Cargo.toml`, `go.mod`, `Gemfile` — Rust / Go / Ruby.
- `.github/workflows/*.yml` or other CI configs — often the most reliable
  source of "what does this project actually run on every push?" In a
  brownfield repo, the CI commands are usually a better source of truth
  than what you'd guess from `package.json` alone.

For a brownfield repo, **use the project's actual commands**, not the
defaults below. If `package.json` defines `test:reliable` as the
canonical gate (and CI runs that, not `test`), run that.

## 2. Run the checks

Run all of these in order, even if an earlier one fails. The user wants
the full picture, not a stop-at-first-failure summary.

### Dependency audit

| Stack | Command |
|-------|---------|
| Node/npm | `npm audit` |
| Node/yarn | `yarn npm audit` |
| Node/pnpm | `pnpm audit` |
| Python | `pip-audit` (or `pip install pip-audit` if missing) |
| Rust | `cargo audit` |

If the audit tool isn't installed, **don't pretend it passed**. Report:

```
✗ Dependency audit: SKIPPED — pip-audit not installed (install: pip install pip-audit)
```

Treat that as a finding the user needs to act on, not a clean line.

### Type check

| Stack | Command |
|-------|---------|
| TypeScript | `npx tsc -b` (or the project's `typecheck` script) |
| Python | `mypy` or `pyright` if the project uses one (check `pyproject.toml`) |

If the project has no type system at all (plain JS, untyped Python), say
so: `Type check: N/A — project is plain JS`. That's neutral, not a
finding, but it's worth flagging because adding types is usually a big
win.

### Tests

| Stack | Command |
|-------|---------|
| Node | The project's `test` (or `test:ci` / `test:reliable`) script |
| Python | `pytest` |
| Rust | `cargo test` |

**If the project has no test script at all**, this is a finding, not a
skip. Report:

```
✗ Tests: NO TEST FRAMEWORK CONFIGURED
```

Then offer to set one up — Vitest for a Vite/TypeScript project, Jest
for a Next.js project, pytest for Python. Don't just say "set up a test
config" — name the framework that fits and offer to run
`/jgl-setup-testing` if the user wants you to.

### Build

| Stack | Command |
|-------|---------|
| Node | `npm run build` (only if a `build` script exists) |
| Python | Skip unless the project has a packaging step |

If no `build` script, say `Build: N/A — no build step defined`. Not a
finding.

### Secrets manifest (only if the secrets module is installed)

If `scripts/secrets.sh` and `.sops.yaml` exist, run the **keyless** manifest
check — it confirms the encrypted files declare exactly the variables named in
`.env.example`, and needs no age key:

```bash
bash scripts/secrets.sh validate
```

Report `✗` if it fails (a missing/extra variable means a deploy could ship an
incomplete secret set). If the module isn't installed, skip this line entirely —
don't treat its absence as a finding. Never run `decrypt`, `edit`, or anything
that would surface a secret value.

## 3. Report

Use a compact summary with explicit markers:

```
✓ Dependency audit — 0 vulnerabilities
✗ Type check — 3 errors (src/lib/foo.ts:14, src/api/bar.ts:88, ...)
✓ Tests — 47 passed, 0 failed
⊘ Build — SKIPPED (no build script)
```

Markers:
- `✓` passed
- `✗` failed
- `⊘` skipped or N/A (always include a reason)

If anything failed, show the relevant error output below the summary. If
anything was skipped because of a missing tool, include the install
command. Don't stop at the first failure — every line of the table
should have a marker.
"""
