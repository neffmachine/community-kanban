<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Kanban</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/theme-tokens.css">
<script src="/theme.js"></script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font-family:var(--sans,system-ui,sans-serif);background:var(--bg,#14140f);color:var(--text,#f0efe8)}
  .card{width:min(360px,calc(100vw - 32px));background:var(--surface,#1e1e18);
        border:1px solid var(--border,#33332a);border-radius:12px;padding:26px}
  h1{margin:0 0 4px;font-size:17px;letter-spacing:.02em}
  p{margin:0 0 18px;font-size:13px;color:var(--muted,#9a9a8c)}
  .row{display:flex;gap:8px}
  input{flex:1;min-width:0;background:var(--bg,#14140f);border:1px solid var(--border,#33332a);
        color:inherit;border-radius:6px;padding:9px 11px;font-size:14px;font-family:inherit}
  button{background:var(--accent,#c2410c);color:#fff;border:none;border-radius:6px;
         padding:9px 16px;font-size:14px;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.6;cursor:default}
  .err{min-height:18px;margin-top:10px;font-size:13px;color:#f0806a}
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Sign in</h1>
    <p>Enter the shop password.</p>
    <div class="row">
      <input id="pw" type="password" placeholder="Shop password" autocomplete="current-password" autofocus>
      <button id="go" type="submit">Sign in</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </form>
<script>
  // Where to land after signing in. Only same-site paths are honoured, so a
  // crafted ?next= can't bounce someone to another site after they log in.
  const raw = new URLSearchParams(location.search).get('next') || '/';
  const next = raw.startsWith('/') && !raw.startsWith('//') ? raw : '/';

  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const go = document.getElementById('go');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (res.ok) { location.replace(next); return; }
      err.textContent = res.status === 401 ? 'Wrong password — try again.' : 'Could not sign in (' + res.status + ').';
    } catch {
      err.textContent = 'Could not reach the server.';
    }
    go.disabled = false;
    document.getElementById('pw').select();
  });
</script>
</body>
</html>
